<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Peter's Revision Hub</title>
<meta name="theme-color" content="#0c0b0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Gig-poster look: near-black, one hot orange, condensed shouty headings. Layout: one column of big tap targets, phone first; home = subject grid, subject = topics with activities, activity = one card at a time */
:root{
  --bg:#0c0b0a; --surface:#171513; --ink:#f4efe9; --muted:#a39a90; --line:#2e2a26;
  --accent:#ff6a13; --accent-ink:#140800; --accent-soft:#3a1d0b;
  --good:#5fd38d; --good-soft:#132a1d; --bad:#ff5d5d; --bad-soft:#341616; --code:#0f0e0d;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2.4rem,9vw,3.6rem);font-weight:400;letter-spacing:.01em;text-transform:uppercase;line-height:1}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:1.25rem;font-weight:400}
h3{font-family:var(--body);font-size:1rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:400;letter-spacing:.04em;text-transform:uppercase;padding:12px 20px;border-radius:10px;font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.back{font-family:var(--mono);font-size:.8rem;color:var(--muted);padding:6px 0;align-self:flex-start}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.stat b{font-family:var(--display);font-size:2rem;font-weight:400;display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.subj{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0}
.subj.focus,.subj.alevel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.subj small{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{font-family:var(--mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);align-self:flex-start}
.list{display:flex;flex-direction:column;gap:10px}
.topic{display:flex;flex-direction:column;gap:8px}
.topic h2{font-size:1.05rem;color:var(--muted);font-family:var(--mono);font-weight:500;text-transform:uppercase;letter-spacing:.05em;padding-top:8px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:14px;align-items:center;text-align:left;width:100%}
.act .ico{font-family:var(--mono);font-size:.68rem;width:60px;flex:none;text-align:center;padding:6px 0;border-radius:8px;background:var(--accent-soft);color:var(--accent);text-transform:uppercase}
.act .txt{flex:1;min-width:0}
.act .score{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.act .score.done{color:var(--good)}
.act .score.low{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:16px}
.progress{font-family:var(--mono);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.qtext{font-size:1.2rem;line-height:1.55}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],textarea,select{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.opts{display:grid;gap:8px}
.opt{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;background:var(--bg)}
.opt.right,.fb.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong,.fb.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{border:1.5px solid;border-radius:10px;padding:12px 14px}
.fb b{font-family:var(--display)}
pre.code{font-family:var(--mono);font-size:.9rem;background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0;overflow-x:auto;line-height:1.5}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.tile{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:var(--bg);font-size:.92rem;overflow-wrap:anywhere}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.no{border-color:var(--bad);background:var(--bad-soft)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.word{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);font-weight:500}
.built{min-height:52px;border:1.5px dashed var(--line);border-radius:10px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.built .word{background:var(--accent-soft);border-color:var(--accent)}
.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.centre{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:400;font-size:1.3rem;letter-spacing:.02em;padding:16px;border-radius:14px;text-align:center}
.branch{display:flex;flex-direction:column;gap:4px}
.branch label{font-family:var(--mono);font-size:.72rem;color:var(--muted);text-transform:uppercase}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg)}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--good)}
.sortcard{font-size:1.15rem;font-weight:600;padding:18px;border-radius:12px;background:var(--bg);border:1.5px solid var(--line);text-align:center}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.diagram{width:100%;max-width:420px;height:auto;align-self:center}
.diagram .shape{fill:var(--bg);stroke:var(--ink);stroke-width:2}
.diagram .fillA{fill:var(--accent-soft);stroke:var(--ink);stroke-width:2}
.diagram .line{fill:none;stroke:var(--ink);stroke-width:2.5}
.diagram .thin{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.diagram .mk circle{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.diagram .mk text{fill:var(--accent-ink);font:700 13px var(--body);text-anchor:middle;dominant-baseline:central}
.diagram .cap{fill:var(--muted);font:12px var(--body)}
.lrow{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.lrow b{font-family:var(--display);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.lrow select.ok{border-color:var(--good);background:var(--good-soft)}
.lrow select.no{border-color:var(--bad);background:var(--bad-soft)}
.timer{font-family:var(--display);font-size:2.6rem;font-weight:400;font-variant-numeric:tabular-nums;color:var(--accent)}
.big{font-family:var(--display);font-size:4.5rem;font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.note{font-size:.85rem;color:var(--muted)}
.xp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.xp .rank{font-family:var(--display);font-size:1.6rem;color:var(--accent);text-transform:uppercase;letter-spacing:.02em}
.xpbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#ffb36b)}
.combo{font-family:var(--display);color:var(--accent);letter-spacing:.04em}
@media (prefers-reduced-motion:no-preference){.card{animation:in .18s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}}}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn.small{padding:8px 12px;font-size:.85rem}
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.chip{display:inline-block;font-family:var(--mono);font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--line)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.ok{background:var(--accent-soft);color:var(--accent)}.chip.bad{background:var(--bad-soft);color:var(--bad)}

</style>
</head>
<body>
<div class="wrap" id="app"><p class="note">Loading…</p></div>
<script src="content.js"></script>
<script src="engine.js"></script>
<script type="module" src="cloud.js"></script>
<script>
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
